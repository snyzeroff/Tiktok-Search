[project]
name = "tiktok-search"
version = "0.1.0"
description = "Recherche plein texte dans tes vidéos TikTok favorites : légende, hashtags, transcription audio et texte à l'écran."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "yt-dlp>=2024.1.0",
  "pillow>=10",
]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.0"]
ocr = ["pytesseract>=0.3.10"]
dev = ["pytest>=8"]

[project.scripts]
tiktok-search = "tiktok_search.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tiktok_search*"]

[tool.setuptools.package-data]
tiktok_search = ["static/*", "static/fonts/*"]
